apis:
- name: SiQ GraphQL API
  description: >-
    SpaceIQ's (SiQ) GraphQL API. A single endpoint at https://api.spaceiq.com/queries
    accepts POST requests with a JSON query body and an access-token bearer header.
    Read operations cover companies, buildings, floors, spaces, departments,
    employees, meeting-room availability/calendars, hoteling-desk search, map
    images, and reports/exports; mutations cover creating and deleting meeting-room
    calendar events. Schema version 1.7, introspectable via __schema / __type.
