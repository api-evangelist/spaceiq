aid: spaceiq
name: SpaceIQ
description: >-
  SpaceIQ (branded SiQ, now part of Eptura) is a workplace and space-management
  platform for optimizing physical office environments: space planning, desk and
  meeting-room booking, hoteling, moves management, wayfinding, floorplan
  management, occupancy analytics, building-attendance reporting, and real-estate
  forecasting. SpaceIQ exposes a GraphQL API (schema version 1.7) at
  api.spaceiq.com/queries for reading workplace data (companies, buildings, floors,
  spaces, departments, employees, meeting-room calendars, map images, and
  reports/exports) and for creating and deleting meeting-room calendar events. All
  access is over HTTPS with an admin/IT-generated access token; the schema is fully
  introspectable.
