pagination:
  style: relay-connections
  pattern: Connection / Edge / Node
  detail: >-
    List fields follow the GraphQL Relay-style connection pattern: a Connection
    holds a list of Edges, each Edge has a Node (the object) and cursor metadata.
    Nodes implement a Node interface (an object with an ID).
