notes: >-
  SpaceIQ is a GraphQL API, so most operation errors surface at HTTP 200 inside
  the GraphQL "errors" array rather than as REST-style 4xx/5xx status codes.
  Transport/auth failures still use HTTP status codes with a simple {"error":...}
  body. This is not an RFC 9457 problem+json catalog.
